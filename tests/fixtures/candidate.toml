# A fictional candidate, so the resume tests run where the owner's resume.toml
# does not exist, CI included. Every name and claim here is invented.
#
# The shape is what the tests need, not realism. Each point below is what lets a
# rule fail when the code breaks it:
# - Contoso's bullets are all tagged out of fullstack and platform, so a build that
#   drops a role with no bullets loses an employer there.
# - Both founder roles are untagged and capped. Without max_bullets they outweigh
#   the engineering roles on a fullstack variant.
# - Neither project is tagged for rails, so a rails variant has projects only
#   through the fallback.

